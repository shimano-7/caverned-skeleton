name: Deploy Stock Lens to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - uses: actions/cache/restore@v4
        with:
          path: .market-cache
          key: jquants-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jquants-v1-
      - name: Diagnose saved Japanese market data (no API access)
        timeout-minutes: 11
        env:
          CACHE_ONLY: 'true'
          SCREEN_LIMIT: '10'
        run: npm run update:market
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .market-cache
          key: jquants-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html style.css app.js analysis.js discovery.js discovery-ui.js _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
